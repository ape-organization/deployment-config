name: Deploy Services

on:
  push:
    branches: [main]
    paths:
      - 'dev/*.yml'
      - 'preprod/*.yml'
      - 'prod/*.yml'

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # ==================================================
      # Checkout Config Repository
      # ==================================================
      - name: Checkout Config Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # Install yq
      # ==================================================
      - name: Install yq
        run: |
          mkdir -p "$HOME/bin"

          wget -qO "$HOME/bin/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64

          chmod +x "$HOME/bin/yq"

          echo "$HOME/bin" >> "$GITHUB_PATH"


      # ==================================================
      # Detect Changed Files
      # ==================================================
      - name: Detect Changed Files
        id: changes
        run: |

          FILES=$(git diff --name-only \
            "${{ github.event.before }}" \
            "${{ github.sha }}")

          if [ -z "$FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"


      # ==================================================
      # Deploy Services
      # ==================================================
      - name: Deploy Services
        if: steps.changes.outputs.skip != 'true'

        env:

          # ==================================================
          # Database Host
          # ==================================================
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}

          # ==================================================
          # DEV - ECOMMERCE
          # ==================================================
          DEV_ECOMMERCE_DATABASE_NAME: ${{ vars.DEV_ECOMMERCE_DATABASE_USERNAME }}
          DEV_ECOMMERCE_DATABASE_USERNAME: ${{ vars.DEV_ECOMMERCE_DATABASE_USERNAME }}
          DEV_ECOMMERCE_DATABASE_PASSWORD: ${{ secrets.DEV_ECOMMERCE_DATABASE_PASSWORD }}


          # ==================================================
          # PREPROD - ECOMMERCE
          # ==================================================
          PREPROD_ECOMMERCE_DATABASE_NAME: ${{ vars.PREPROD_ECOMMERCE_DATABASE_USERNAME }}
          PREPROD_ECOMMERCE_DATABASE_USERNAME: ${{ vars.PREPROD_ECOMMERCE_DATABASE_USERNAME }}
          PREPROD_ECOMMERCE_DATABASE_PASSWORD: ${{ secrets.PREPROD_ECOMMERCE_DATABASE_PASSWORD }}


          # ==================================================
          # PROD - ECOMMERCE
          # ==================================================
          PROD_ECOMMERCE_DATABASE_NAME: ${{ vars.PROD_ECOMMERCE_DATABASE_USERNAME }}
          PROD_ECOMMERCE_DATABASE_USERNAME: ${{ vars.PROD_ECOMMERCE_DATABASE_USERNAME }}
          PROD_ECOMMERCE_DATABASE_PASSWORD: ${{ secrets.PROD_ECOMMERCE_DATABASE_PASSWORD }}


          # ==================================================
          # DEV - STUDENTS CENTER MANAGEMENT
          # ==================================================
          DEV_STUDENTSCENTERMANAGEMENT_DATABASE_NAME: ${{ vars.DEV_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME }}
          DEV_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME: ${{ vars.DEV_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME }}
          DEV_STUDENTSCENTERMANAGEMENT_DATABASE_PASSWORD: ${{ secrets.DEV_STUDENTSCENTERMANAGEMENT_DATABASE_PASSWORD }}


          # ==================================================
          # PREPROD - STUDENTS CENTER MANAGEMENT
          # ==================================================
          PREPROD_STUDENTSCENTERMANAGEMENT_DATABASE_NAME: ${{ vars.PREPROD_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME }}
          PREPROD_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME: ${{ vars.PREPROD_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME }}
          PREPROD_STUDENTSCENTERMANAGEMENT_DATABASE_PASSWORD: ${{ secrets.PREPROD_STUDENTSCENTERMANAGEMENT_DATABASE_PASSWORD }}


          # ==================================================
          # PROD - STUDENTS CENTER MANAGEMENT
          # ==================================================
          PROD_STUDENTSCENTERMANAGEMENT_DATABASE_NAME: ${{ vars.PROD_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME }}
          PROD_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME: ${{ vars.PROD_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME }}
          PROD_STUDENTSCENTERMANAGEMENT_DATABASE_PASSWORD: ${{ secrets.PROD_STUDENTSCENTERMANAGEMENT_DATABASE_PASSWORD }}


        run: |

          set -e


          # ==================================================
          # Process Changed Files
          # ==================================================
          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue


            echo ""
            echo "========================================"
            echo "Deploying: $FILE"
            echo "========================================"


            # ==================================================
            # Environment
            # ==================================================
            ENV=$(echo "$FILE" | cut -d'/' -f1)


            # ==================================================
            # Service Name
            # ==================================================
            SERVICE=$(basename "$FILE" .yml)


            # ==================================================
            # Read YAML Configuration
            # ==================================================
            TAG=$(yq e '.tag' "$FILE")
            REPO=$(yq e '.repo' "$FILE")
            TYPE=$(yq e '.type' "$FILE")
            APP_PORT=$(yq e '.port' "$FILE")


            echo "Environment : $ENV"
            echo "Service     : $SERVICE"
            echo "Repository  : $REPO"
            echo "Tag         : $TAG"
            echo "Type        : $TYPE"
            echo "Port        : $APP_PORT"


            # ==================================================
            # Paths
            # ==================================================
            BASE="/home/Center-management/$ENV/$SERVICE"

            RELEASE="$BASE/releases/$TAG"

            WORKSPACE="/tmp/build/$SERVICE-$TAG"


            mkdir -p "$RELEASE"

            rm -rf "$WORKSPACE"


            # ==================================================
            # Clone Repository
            # ==================================================
            echo ""
            echo "Downloading repository: $REPO"


            git clone \
              "https://github.com/${REPO}.git" \
              "$WORKSPACE"


            cd "$WORKSPACE"


            echo "Checking out tag: $TAG"


            git checkout "$TAG"


            # ==================================================
            # Create Dynamic Database Variable Names
            # ==================================================

            # Example:
            #
            # Landing_Page
            # ↓
            # LANDING_PAGE
            #
            # dev
            # ↓
            # DEV
            #
            # DEV_LANDING_PAGE_DATABASE_NAME

            SERVICE_KEY=$(echo "$SERVICE" \
              | tr '[:lower:]' '[:upper:]' \
              | tr '-' '_')


            ENV_KEY=$(echo "$ENV" \
              | tr '[:lower:]' '[:upper:]')


            DB_NAME_VAR="${ENV_KEY}_${SERVICE_KEY}_DATABASE_NAME"

            DB_USER_VAR="${ENV_KEY}_${SERVICE_KEY}_DATABASE_USERNAME"

            DB_PASS_VAR="${ENV_KEY}_${SERVICE_KEY}_DATABASE_PASSWORD"


            echo ""
            echo "========================================"
            echo "Database Configuration"
            echo "========================================"

            echo "Environment: $ENV"
            echo "Service: $SERVICE"
            echo "Service Type: $TYPE"

            echo "DB Name Variable: $DB_NAME_VAR"
            echo "DB User Variable: $DB_USER_VAR"
            echo "DB Password Variable: $DB_PASS_VAR"


            # ==================================================
            # Database Configuration
            #
            # Only services that actually require a database
            # will load and validate database variables.
            # ==================================================

            DB_HOST="$DATABASE_HOST"


            if [[ "$TYPE" == "java" || "$TYPE" == "dotnet" || "$TYPE" == "docker" ]]; then

              DB_NAME="${!DB_NAME_VAR:-}"
              DB_USER="${!DB_USER_VAR:-}"
              DB_PASS="${!DB_PASS_VAR:-}"


              echo ""
              echo "Database is required for service type: $TYPE"


              # ==================================================
              # Validate Database Host
              # ==================================================
              if [ -z "$DB_HOST" ]; then
                echo "ERROR: DATABASE_HOST is empty"
                exit 1
              fi


              # ==================================================
              # Validate Database Name
              # ==================================================
              if [ -z "$DB_NAME" ]; then
                echo "ERROR: Database name is empty."
                echo "Expected variable: $DB_NAME_VAR"
                exit 1
              fi


              # ==================================================
              # Validate Database Username
              # ==================================================
              if [ -z "$DB_USER" ]; then
                echo "ERROR: Database username is empty."
                echo "Expected variable: $DB_USER_VAR"
                exit 1
              fi


              # ==================================================
              # Validate Database Password
              # ==================================================
              if [ -z "$DB_PASS" ]; then
                echo "ERROR: Database password is empty."
                echo "Expected variable: $DB_PASS_VAR"
                exit 1
              fi


              echo "Database configuration loaded successfully."


            else

              echo ""
              echo "Service type '$TYPE' does not require database configuration."

              DB_NAME=""
              DB_USER=""
              DB_PASS=""

            fi


            # ==================================================
            # Deploy Based On Service Type
            # ==================================================

            echo ""
            echo "========================================"
            echo "Deploying $SERVICE in $ENV"
            echo "========================================"


            case "$TYPE" in


              # ==================================================
              # JAVA / SPRING BOOT
              # ==================================================
              java)

                echo "Building Java project..."


                mvn -B clean package -DskipTests


                IMAGE_NAME=$(echo "$SERVICE" \
                  | tr '[:upper:]' '[:lower:]')


                CONTAINER_NAME="${ENV}-${IMAGE_NAME}"


                echo "Building Docker image..."


                docker build \
                  -t "${IMAGE_NAME}:${TAG}" \
                  .


                echo "Removing old container..."


                docker rm -f \
                  "$CONTAINER_NAME" \
                  2>/dev/null || true


                echo "Starting container..."


                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --network center-network \
                  -p "${APP_PORT}:8080" \
                  -e SPRING_PROFILES_ACTIVE="$ENV" \
                  -e SPRING_DATASOURCE_URL="jdbc:sqlserver://${DB_HOST}:1433;databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true" \
                  -e SPRING_DATASOURCE_USERNAME="$DB_USER" \
                  -e SPRING_DATASOURCE_PASSWORD="$DB_PASS" \
                  "${IMAGE_NAME}:${TAG}"


                ;;


              # ==================================================
              # .NET / ASP.NET CORE
              # ==================================================
              dotnet)

                IMAGE_NAME=$(echo "$SERVICE" \
                  | tr '[:upper:]' '[:lower:]')


                CONTAINER_NAME="${ENV}-${IMAGE_NAME}"


                echo "Building .NET Docker image..."


                docker build \
                  -t "${IMAGE_NAME}:${TAG}" \
                  .


                echo "Removing old container..."


                docker rm -f \
                  "$CONTAINER_NAME" \
                  2>/dev/null || true


                echo "Starting .NET container..."


                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --network center-network \
                  -p "${APP_PORT}:8080" \
                  -v "/var/www/uploads/${SERVICE}:/var/www/uploads/${SERVICE}" \
                  -e ASPNETCORE_ENVIRONMENT="$ENV" \
                  -e ASPNETCORE_URLS="http://+:8080" \
                  -e ConnectionStrings__DefaultConnection="Server=${DB_HOST};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASS};TrustServerCertificate=True;" \
                  "${IMAGE_NAME}:${TAG}"


                ;;


              # ==================================================
              # NODE
              # ==================================================
              node)

                npm ci


                npm run build || true


                rsync -a . "$RELEASE"


                ;;


              # ==================================================
              # PYTHON
              # ==================================================
              python)

                pip install -r requirements.txt || true


                rsync -a . "$RELEASE"


                ;;


              # ==================================================
              # ANGULAR
              #
              # Angular is built inside Docker.
              # No npm install or npm build is executed here.
              # ==================================================
              angular)

                IMAGE_NAME=$(echo "$SERVICE" \
                  | tr '[:upper:]' '[:lower:]')


                CONTAINER_NAME="${ENV}-${IMAGE_NAME}"


                echo "Building Angular Docker image..."


                docker build \
                  -t "${IMAGE_NAME}:${TAG}" \
                  .


                echo "Removing old Angular container..."


                docker rm -f \
                  "$CONTAINER_NAME" \
                  2>/dev/null || true


                echo "Starting Angular container..."


                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --network center-network \
                  -p "${APP_PORT}:80" \
                  "${IMAGE_NAME}:${TAG}"


                ;;


              # ==================================================
              # GENERIC DOCKER SERVICE
              # ==================================================
              docker)

                IMAGE_NAME=$(echo "$SERVICE" \
                  | tr '[:upper:]' '[:lower:]')


                CONTAINER_NAME="${ENV}-${IMAGE_NAME}"


                echo "Building Docker image..."


                docker build \
                  -t "${IMAGE_NAME}:${TAG}" \
                  .


                echo "Removing old container..."


                docker rm -f \
                  "$CONTAINER_NAME" \
                  2>/dev/null || true


                echo "Starting Docker container..."


                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --network center-network \
                  -e DATABASE_HOST="$DB_HOST" \
                  -e DATABASE_NAME="$DB_NAME" \
                  -e DATABASE_USERNAME="$DB_USER" \
                  -e DATABASE_PASSWORD="$DB_PASS" \
                  "${IMAGE_NAME}:${TAG}"


                ;;


              # ==================================================
              # UNKNOWN TYPE
              # ==================================================
              *)

                echo "ERROR: Unknown service type: $TYPE"

                exit 1

                ;;

            esac


            echo ""
            echo "========================================"
            echo "SUCCESS: $SERVICE deployed successfully"
            echo "========================================"


          done <<< "${{ steps.changes.outputs.files }}"
