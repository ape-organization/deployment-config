name: Deploy Services

on:
  push:
    branches: [main]
    paths:
      - 'dev/*.yml'
      - 'preprod/*.yml'
      - 'prod/*.yml'

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      # ==================================================
      # Checkout Config Repository
      # ==================================================
      - name: Checkout Config Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # Install yq
      # ==================================================
      - name: Install yq
        run: |
          mkdir -p "$HOME/bin"

          wget -qO "$HOME/bin/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64

          chmod +x "$HOME/bin/yq"

          echo "$HOME/bin" >> "$GITHUB_PATH"


      # ==================================================
      # Detect Changed Files
      # ==================================================
      - name: Detect Changed Files
        id: changes
        run: |

          # Only service files (ignore deleted files and the workflow itself)
          FILES=$(git diff --name-only --diff-filter=ACMR \
            "${{ github.event.before }}" \
            "${{ github.sha }}" \
            | grep -E '^(dev|preprod|prod)/[^/]+\.yml$' || true)

          if [ -z "$FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"


      # ==================================================
      # Deploy Services
      # ==================================================
      - name: Deploy Services
        if: steps.changes.outputs.skip != 'true'

        env:

          # ==================================================
          # All secrets (used by the "secrets:" list in each service file)
          # ==================================================
          ALL_SECRETS: ${{ toJSON(secrets) }}


          # ==================================================
          # Automatic port range
          # ==================================================
          PORT_START: 5000
          PORT_END: 5999


          # ==================================================
          # Database Host
          # ==================================================
          DATABASE_HOST: ${{ secrets.DATABASE_HOST }}
          DATABASE_HOST_JAVA : ${{ secrets.DATABASE_HOST_JAVA }}


          # ==================================================
          # DEV - PinkyAura
          # ==================================================
          DEV_PINKYAURA_DATABASE_NAME: ${{ vars.DEV_PinkyAura_DATABASE_NAME }}
          DEV_PINKYAURA_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DEV_PINKYAURA_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


          # ==================================================
          # PREPROD - PinkyAura
          # ==================================================
          PREPROD_PINKYAURA_DATABASE_NAME: ${{ vars.PREPROD_PinkyAura_DATABASE_NAME }}
          PREPROD_PINKYAURA_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          PREPROD_PINKYAURA_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


          # ==================================================
          # PROD - PinkyAura
          # ==================================================
          PROD_PINKYAURA_DATABASE_NAME: ${{ vars.PROD_PinkyAura_DATABASE_NAME }}
          PROD_PINKYAURA_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          PROD_PINKYAURA_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


          # ==================================================
          # DEV - Lily
          # ==================================================
          DEV_LILLYAPI_DATABASE_NAME: ${{ vars.DEV_LILLYAPI_DATABASE_NAME }}
          DEV_LILLYAPI_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DEV_LILLYAPI_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


          # ==================================================
          # PREPROD - Lily
          # ==================================================
          PREPROD_LILLYAPI_DATABASE_NAME: ${{ vars.PREPROD_LILLYAPI_DATABASE_NAME }}
          PREPROD_LILLYAPI_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          PREPROD_LILLYAPI_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


          # ==================================================
          # PROD - Lily
          # ==================================================
          PROD_LILLYAPI_DATABASE_NAME: ${{ vars.PROD_LILLYAPI_DATABASE_NAME }}
          PROD_LILLYAPI_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          PROD_LILLYAPI_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


          # ==================================================
          # DEV - STUDENTS CENTER MANAGEMENT
          # ==================================================
          DEV_STUDENTSCENTERMANAGEMENT_DATABASE_NAME: ${{ vars.DEV_STUDENTSCENTERMANAGEMENT_DATABASE_NAME }}
          DEV_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DEV_STUDENTSCENTERMANAGEMENT_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


          # ==================================================
          # PREPROD - STUDENTS CENTER MANAGEMENT
          # ==================================================
          PREPROD_STUDENTSCENTERMANAGEMENT_DATABASE_NAME: ${{ vars.PREPROD_STUDENTSCENTERMANAGEMENT_DATABASE_NAME }}
          PREPROD_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          PREPROD_STUDENTSCENTERMANAGEMENT_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


          # ==================================================
          # PROD - STUDENTS CENTER MANAGEMENT
          # ==================================================
          PROD_STUDENTSCENTERMANAGEMENT_DATABASE_NAME: ${{ vars.PROD_STUDENTSCENTERMANAGEMENT_DATABASE_NAME }}
          PROD_STUDENTSCENTERMANAGEMENT_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          PROD_STUDENTSCENTERMANAGEMENT_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


          # ==================================================
          # DEV - SMS
          # ==================================================
          DEV_SMS_DATABASE_NAME: ${{ vars.DEV_SMS_DATABASE_NAME }}
          DEV_SMS_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DEV_SMS_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


          # ==================================================
          # PREPROD - SMS
          # ==================================================
          PREPROD_SMS_DATABASE_NAME: ${{ vars.PREPROD_SMS_DATABASE_NAME }}
          PREPROD_SMS_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          PREPROD_SMS_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


          # ==================================================
          # PROD - SMS
          # ==================================================
          PROD_SMS_DATABASE_NAME: ${{ vars.PROD_SMS_DATABASE_NAME }}
          PROD_SMS_DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          PROD_SMS_DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}


        run: |

          set -e

          CONFIG_DIR="$GITHUB_WORKSPACE"

          echo "## Deployed Services" >> "$GITHUB_STEP_SUMMARY"


          # ==================================================
          # Process Changed Files
          # ==================================================
          while IFS= read -r FILE; do

            [ -z "$FILE" ] && continue

            # Always go back to the config repo before reading the next file
            cd "$CONFIG_DIR"


            echo ""
            echo "========================================"
            echo "Deploying: $FILE"
            echo "========================================"


            # ==================================================
            # Environment + Service Name
            # ==================================================
            ENV=$(echo "$FILE" | cut -d'/' -f1)

            SERVICE=$(basename "$FILE" .yml)


            # ==================================================
            # Read YAML Configuration
            # ==================================================
            TAG=$(yq e '.tag' "$FILE")
            REPO=$(yq e '.repo' "$FILE")
            TYPE=$(yq e '.type' "$FILE")
            PROJECT_PATH=$(yq e '.path // ""' "$FILE")
            APP_PORT=$(yq e '.port // ""' "$FILE")
            UPLOAD_SERVICE=$(yq e '.uploadPath // ""' "$FILE")
            SECRET_NAMES=$(yq e '.secrets // [] | .[]' "$FILE")


            # ==================================================
            # Names + Paths
            # ==================================================
            IMAGE_NAME=$(echo "$SERVICE" \
              | tr '[:upper:]' '[:lower:]')

            CONTAINER_NAME="${ENV}-${IMAGE_NAME}"

            BASE="/home/Center-management/$ENV/$SERVICE"

            RELEASE="$BASE/releases/$TAG"

            WORKSPACE="/tmp/build/$SERVICE-$TAG"


            mkdir -p "$RELEASE"

            rm -rf "$WORKSPACE"


            # ==================================================
            # Automatic Port
            #
            # If "port" is not set in the service file:
            #   1) reuse the port of the existing container
            #   2) otherwise take the first free port in the range
            # ==================================================
            if [[ "$TYPE" == "java" || "$TYPE" == "dotnet" || "$TYPE" == "angular" || "$TYPE" == "html" ]] \
               && [ -z "$APP_PORT" ]; then

              APP_PORT=$(docker inspect \
                -f '{{range $k, $v := .HostConfig.PortBindings}}{{range $v}}{{.HostPort}} {{end}}{{end}}' \
                "$CONTAINER_NAME" 2>/dev/null \
                | awk '{print $1}' || true)


              if [ -z "$APP_PORT" ]; then

                USED_PORTS=$(
                  {
                    ss -ltn | awk 'NR>1 {print $4}' | awk -F: '{print $NF}'

                    docker ps -aq | xargs -r docker inspect \
                      -f '{{range $k, $v := .HostConfig.PortBindings}}{{range $v}}{{.HostPort}} {{end}}{{end}}' \
                      | tr ' ' '\n'
                  } | grep -E '^[0-9]+$' | sort -u
                )

                for P in $(seq "$PORT_START" "$PORT_END"); do
                  if ! grep -qx "$P" <<< "$USED_PORTS"; then
                    APP_PORT="$P"
                    break
                  fi
                done

              fi


              if [ -z "$APP_PORT" ]; then
                echo "ERROR: No free port between $PORT_START and $PORT_END"
                exit 1
              fi

            fi


            echo "Environment : $ENV"
            echo "Service     : $SERVICE"
            echo "Repository  : $REPO"
            echo "Path        : ${PROJECT_PATH:-/}"
            echo "Tag         : $TAG"
            echo "Type        : $TYPE"
            echo "Port        : ${APP_PORT:-none}"


            # ==================================================
            # Secrets From Service File

            SECRET_ARGS=()

            for S in $SECRET_NAMES; do

              KEY=$(echo "$S" | tr '[:lower:]' '[:upper:]')

              VALUE=$(echo "$ALL_SECRETS" | yq -p=json ".${KEY} // \"\"")

              if [ -z "$VALUE" ]; then
                echo "ERROR: Secret '$KEY' not found in GitHub secrets"
                exit 1
              fi

              SECRET_ARGS+=(-e "${S}=${VALUE}")

              echo "Secret      : $S"

            done


            # ==================================================
            # Clone Repository
            # ==================================================
            echo ""
            echo "Downloading repository: $REPO"


            git clone \
              "https://github.com/${REPO}.git" \
              "$WORKSPACE"


            cd "$WORKSPACE"


            echo "Checking out tag: $TAG"


            git checkout "$TAG"


            # ==================================================
            # Go To Project Folder (if "path" is set)
            # ==================================================
            if [ -n "$PROJECT_PATH" ]; then

              if [ ! -d "$WORKSPACE/$PROJECT_PATH" ]; then
                echo "ERROR: Path '$PROJECT_PATH' not found in $REPO"
                exit 1
              fi

              cd "$WORKSPACE/$PROJECT_PATH"

            fi


            # ==================================================
            # Create Dynamic Database Variable Names
            # ==================================================
            SERVICE_KEY=$(echo "$SERVICE" \
              | tr '[:lower:]' '[:upper:]' \
              | tr '-' '_')


            ENV_KEY=$(echo "$ENV" \
              | tr '[:lower:]' '[:upper:]')


            DB_NAME_VAR="${ENV_KEY}_${SERVICE_KEY}_DATABASE_NAME"

            DB_USER_VAR="${ENV_KEY}_${SERVICE_KEY}_DATABASE_USERNAME"

            DB_PASS_VAR="${ENV_KEY}_${SERVICE_KEY}_DATABASE_PASSWORD"


            # ==================================================
            # Database Configuration
            # ==================================================
            DB_HOST="$DATABASE_HOST"
            DB_HOST_JAVA="$DATABASE_HOST_JAVA"


            if [[ "$TYPE" == "java" || "$TYPE" == "dotnet" || "$TYPE" == "docker" ]]; then

              DB_NAME="${!DB_NAME_VAR:-}"
              DB_USER="${!DB_USER_VAR:-}"
              DB_PASS="${!DB_PASS_VAR:-}"


              if [ -z "$DB_HOST" ]; then
                echo "ERROR: DATABASE_HOST is empty"
                exit 1
              fi

              if [ -z "$DB_NAME" ]; then
                echo "ERROR: Database name is empty. Expected variable: $DB_NAME_VAR"
                exit 1
              fi

              if [ -z "$DB_USER" ]; then
                echo "ERROR: Database username is empty. Expected variable: $DB_USER_VAR"
                exit 1
              fi

              if [ -z "$DB_PASS" ]; then
                echo "ERROR: Database password is empty. Expected variable: $DB_PASS_VAR"
                exit 1
              fi


              echo "Database configuration loaded successfully."

            else

              DB_NAME=""
              DB_USER=""
              DB_PASS=""

            fi


            # ==================================================
            # Deploy Based On Service Type
            # ==================================================
            echo ""
            echo "========================================"
            echo "Deploying $SERVICE in $ENV"
            echo "========================================"


            case "$TYPE" in


              # ==================================================
              # JAVA / SPRING BOOT
              # ==================================================
              java)

                mvn -B clean package -DskipTests

                docker build -t "${IMAGE_NAME}:${TAG}" .

                docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --network center-network \
                  -p "${APP_PORT}:8080" \
                  -e SPRING_PROFILES_ACTIVE="$ENV" \
                  -e SPRING_DATASOURCE_URL="jdbc:sqlserver://${DB_HOST_JAVA}:1433;databaseName=${DB_NAME};encrypt=true;trustServerCertificate=true" \
                  -e SPRING_DATASOURCE_USERNAME="$DB_USER" \
                  -e SPRING_DATASOURCE_PASSWORD="$DB_PASS" \
                  "${SECRET_ARGS[@]}" \
                  "${IMAGE_NAME}:${TAG}"

                ;;


              # ==================================================
              # .NET / ASP.NET CORE
              # ==================================================
              dotnet)

                docker build -t "${IMAGE_NAME}:${TAG}" .

                docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

                UPLOAD_ARGS=()
                if [ -n "$UPLOAD_SERVICE" ]; then
                  UPLOAD_ARGS=(-v "/var/www/uploads/${UPLOAD_SERVICE}:/var/www/uploads/${UPLOAD_SERVICE}")
                fi

                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --network center-network \
                  -p "${APP_PORT}:8080" \
                  "${UPLOAD_ARGS[@]}" \
                  -e ASPNETCORE_ENVIRONMENT="$ENV" \
                  -e ASPNETCORE_URLS="http://+:8080" \
                  -e ConnectionStrings__DefaultConnection="Server=${DB_HOST};Database=${DB_NAME};User Id=${DB_USER};Password=${DB_PASS};TrustServerCertificate=True;" \
                  "${SECRET_ARGS[@]}" \
                  "${IMAGE_NAME}:${TAG}"

                ;;


              # ==================================================
              # NODE
              # ==================================================
              node)

                npm ci

                npm run build || true

                rsync -a . "$RELEASE"

                ;;


              # ==================================================
              # PYTHON
              # ==================================================
              python)

                pip install -r requirements.txt || true

                rsync -a . "$RELEASE"

                ;;


              # ==================================================
              # ANGULAR (built inside Docker)
              # ==================================================
              angular)

                docker build \
                  --build-arg APP_ENV="${ENV}" \
                  -t "${IMAGE_NAME}:${TAG}" \
                  .

                docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --network center-network \
                  --add-host=host.docker.internal:host-gateway \
                  -p "${APP_PORT}:80" \
                  "${SECRET_ARGS[@]}" \
                  "${IMAGE_NAME}:${TAG}"

                ;;


              # ==================================================
              # STATIC HTML (nginx)
              # ==================================================
              html)

                rsync -a --delete --exclude '.git' . "$RELEASE"

                docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --network center-network \
                  -p "${APP_PORT}:80" \
                  -v "${RELEASE}:/usr/share/nginx/html:ro" \
                  nginx:alpine

                ;;


              # ==================================================
              # GENERIC DOCKER SERVICE
              # ==================================================
              docker)

                docker build -t "${IMAGE_NAME}:${TAG}" .

                docker rm -f "$CONTAINER_NAME" 2>/dev/null || true

                docker run -d \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --network center-network \
                  -e DATABASE_HOST="$DB_HOST" \
                  -e DATABASE_NAME="$DB_NAME" \
                  -e DATABASE_USERNAME="$DB_USER" \
                  -e DATABASE_PASSWORD="$DB_PASS" \
                  "${SECRET_ARGS[@]}" \
                  "${IMAGE_NAME}:${TAG}"

                ;;


              # ==================================================
              # UNKNOWN TYPE
              # ==================================================
              *)

                echo "ERROR: Unknown service type: $TYPE"

                exit 1

                ;;

            esac


            echo ""
            echo "========================================"
            echo "SUCCESS: $SERVICE deployed on port ${APP_PORT:-none}"
            echo "========================================"

            echo "- **$ENV/$SERVICE** → port \`${APP_PORT:-none}\`" >> "$GITHUB_STEP_SUMMARY"


          done <<< "${{ steps.changes.outputs.files }}"
